<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">MimicArm 모듈 계층과 데이터 흐름</title>
  <desc id="desc">버튼 입력의 디바운스부터 모드 제어, 자세 저장, 증분 보간, 서보 PWM 출력까지의 Verilog 모듈 연결을 나타낸다.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#fff;stroke:#8c959f}.fillA{fill:#ddf4ff;stroke:#54aeff}.fillB{fill:#ffebe9;stroke:#ff8182}.fillC{fill:#fbefff;stroke:#d8b9ff}.fillN{fill:#eef1f4;stroke:#afb8c1}
      .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.m,.lbl{fill:#656d76;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.k{fill:#1f2328;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .hdr{fill:#0969da;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.hdrB{fill:#cf222e;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.hdrC{fill:#8250df;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
      .wire{stroke:#7d8590;fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.wired{stroke:#7d8590;fill:none;stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
      @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#6e7681}.fillA{fill:#12283f;stroke:#316dca}.fillB{fill:#3c1618;stroke:#b62324}.fillC{fill:#271052;stroke:#8957e5}.fillN{fill:#21262d;stroke:#484f58}.t,.k{fill:#e6edf3}.m,.lbl{fill:#9198a1}.hdr{fill:#58a6ff}.hdrB{fill:#ff7b72}.hdrC{fill:#d2a8ff}.wire,.wired{stroke:#7d8590}}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d8590"/></marker>
  </defs>

  <rect class="bg" width="980" height="760"/>
  <rect x="24" y="24" width="932" height="128" rx="10" class="panel" stroke-width="1.2"/>
  <text x="44" y="51" class="hdr">Clock &amp; Tick</text>
  <rect x="44" y="70" width="180" height="48" rx="6" class="fillC" stroke-width="1.2"/>
  <text x="134" y="90" class="k" font-size="11" text-anchor="middle" font-weight="700">i_clk</text>
  <text x="134" y="106" class="m" font-size="9.5" text-anchor="middle">100 MHz</text>
  <line x1="224" y1="94" x2="300" y2="94" class="wire" marker-end="url(#ah)"/>
  <rect x="300" y="58" width="280" height="72" rx="7" class="fillA" stroke-width="1.2"/>
  <text x="314" y="81" class="k" font-size="12" font-weight="700">tick_gen</text>
  <text x="314" y="101" class="m" font-size="10">Clock enable pulse만 생성 · 파생 Clock 없음</text>
  <text x="314" y="118" class="m" font-size="9.5">카운터 비교 기반 단일 Clock Domain</text>
  <line x1="580" y1="94" x2="640" y2="94" class="wire" marker-end="url(#ah)"/>
  <rect x="640" y="58" width="292" height="72" rx="7" class="card" stroke-width="1.2"/>
  <text x="654" y="79" class="k" font-size="10.5" font-weight="600">jog_tick</text><text x="744" y="79" class="m" font-size="9.5">50 Hz · angle_ctrl</text>
  <text x="654" y="99" class="k" font-size="10.5" font-weight="600">interp_tick</text><text x="744" y="99" class="m" font-size="9.5">100 Hz · interp ×3</text>
  <text x="654" y="119" class="k" font-size="10.5" font-weight="600">dwell_tick</text><text x="744" y="119" class="m" font-size="9.5">1 Hz · 현재 미사용</text>

  <rect x="24" y="176" width="932" height="560" rx="10" class="panel" stroke-width="1.2"/>
  <text x="44" y="203" class="hdr">Input</text>
  <text x="270" y="203" class="hdrC">Control</text>
  <text x="520" y="203" class="hdr">Pose Data</text>
  <text x="760" y="203" class="hdrB">Interpolation &amp; Output</text>

  <rect x="44" y="220" width="180" height="76" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="58" y="243" class="k" font-size="11" font-weight="700">Board Buttons ×5</text>
  <text x="58" y="263" class="t" font-size="10">BTNL/R · BTNC · BTNU/D</text>
  <text x="58" y="282" class="m" font-size="9.5">관절 선택 · 저장 · 각도 증감</text>
  <line x1="224" y1="258" x2="270" y2="258" class="wire" marker-end="url(#ah)"/>

  <rect x="270" y="220" width="180" height="76" rx="7" class="card" stroke-width="1.2"/>
  <text x="284" y="243" class="k" font-size="11" font-weight="700">debounce ×5</text>
  <text x="284" y="263" class="t" font-size="10">2FF 동기화 · 10 ms</text>
  <text x="284" y="282" class="m" font-size="9.5">edge / level 출력 분리</text>
  <line x1="450" y1="242" x2="510" y2="242" class="wire" marker-end="url(#ah)"/>

  <rect x="510" y="216" width="210" height="62" rx="7" class="fillN" stroke-width="1.2"/>
  <text x="524" y="239" class="k" font-size="11" font-weight="700">joint_select</text>
  <text x="524" y="259" class="m" font-size="9.5">BTNL/R edge → joint_sel[1:0]</text>

  <rect x="44" y="344" width="180" height="62" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="58" y="367" class="k" font-size="11" font-weight="700">i_sw_mode[1:0]</text>
  <text x="58" y="387" class="m" font-size="9.5">MANUAL · RECORD · PLAY</text>
  <line x1="224" y1="375" x2="270" y2="375" class="wire" marker-end="url(#ah)"/>

  <rect x="270" y="330" width="210" height="104" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="284" y="354" class="k" font-size="11.5" font-weight="700">mode_fsm</text>
  <text x="284" y="375" class="t" font-size="10">모드 · 저장 개수 · 재생 포인터</text>
  <text x="284" y="393" class="m" font-size="9.5">we · addr · pose_count · play_mode</text>
  <text x="284" y="411" class="m" font-size="9.5">i_btn_save · target_reached_pulse</text>
  <line x1="480" y1="360" x2="520" y2="360" class="wire" marker-end="url(#ah)"/>
  <text x="500" y="351" class="lbl" font-size="8.8" text-anchor="middle">we/addr</text>

  <rect x="520" y="314" width="200" height="92" rx="7" class="fillA" stroke-width="1.2"/>
  <text x="534" y="338" class="k" font-size="11.5" font-weight="700">reg_bank</text>
  <text x="534" y="359" class="t" font-size="10">D-FF 25-bit × 8</text>
  <text x="534" y="377" class="m" font-size="9.5">{gripper, el, sh, base}</text>
  <text x="534" y="394" class="m" font-size="9.5">비동기 Read · BRAM 미사용</text>

  <polyline points="450,282 740,282 740,550 680,550 680,530" class="wire" marker-end="url(#ah)"/>
  <polyline points="720,247 740,247 740,282" class="wire"/>
  <text x="594" y="275" class="lbl" font-size="9">BTNU/D level + joint_sel</text>
  <line x1="620" y1="406" x2="620" y2="452" class="wire" marker-end="url(#ah)"/>
  <text x="633" y="433" class="lbl" font-size="8.8">pose_data</text>

  <rect x="520" y="452" width="200" height="78" rx="7" class="fillA" stroke-width="1.2"/>
  <text x="534" y="476" class="k" font-size="11.5" font-weight="700">angle_ctrl</text>
  <text x="534" y="497" class="t" font-size="10">MANUAL ±1° 목표각</text>
  <text x="534" y="515" class="m" font-size="9.5">PLAY pose_data override · jog_tick</text>
  <line x1="720" y1="491" x2="760" y2="491" class="wire" marker-end="url(#ah)"/>

  <rect x="760" y="452" width="180" height="78" rx="7" class="fillN" stroke-width="1.2"/>
  <text x="774" y="476" class="k" font-size="11.5" font-weight="700">interp ×3</text>
  <text x="774" y="497" class="t" font-size="10">현재각을 목표각에 ±1 접근</text>
  <text x="774" y="515" class="m" font-size="9.5">100 Hz · 나눗셈 미사용</text>

  <polyline points="850,452 850,304 375,304 375,330" class="wired" marker-end="url(#ah)"/>
  <text x="642" y="297" class="lbl" font-size="9" text-anchor="middle">r_target_reached_pulse · top에서 생성</text>

  <line x1="375" y1="434" x2="375" y2="512" class="wire" marker-end="url(#ah)"/>
  <rect x="270" y="512" width="210" height="70" rx="7" class="card" stroke-width="1.2"/>
  <text x="284" y="536" class="k" font-size="11" font-weight="700">seg_display</text>
  <text x="284" y="557" class="t" font-size="10">모드 · 자세 번호 · 관절 선택</text>
  <text x="284" y="573" class="m" font-size="9.5">4-digit Time Multiplexing</text>

  <rect x="520" y="574" width="200" height="54" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="534" y="596" class="k" font-size="11" font-weight="700">i_sw_gripper</text>
  <text x="534" y="615" class="m" font-size="9.5">집게 0° / 90° 선택</text>
  <polyline points="520,601 500,601 500,385 520,385" class="wired" marker-end="url(#ah)"/>
  <line x1="720" y1="601" x2="760" y2="601" class="wire" marker-end="url(#ah)"/>

  <line x1="850" y1="530" x2="850" y2="574" class="wire" marker-end="url(#ah)"/>
  <rect x="760" y="574" width="180" height="70" rx="7" class="fillB" stroke-width="1.2"/>
  <text x="774" y="598" class="k" font-size="11.5" font-weight="700">pwm_servo ×4</text>
  <text x="774" y="619" class="t" font-size="10">20 ms · 1~2 ms Duty</text>
  <text x="774" y="635" class="m" font-size="9.5">각도 Clamp · 곱셈 기반 변환</text>
  <line x1="850" y1="644" x2="850" y2="674" class="wire" marker-end="url(#ah)"/>
  <rect x="760" y="674" width="180" height="40" rx="20" class="fillB" stroke-width="1.2"/>
  <text x="850" y="699" class="k" font-size="10.5" text-anchor="middle" font-weight="700">JA1~JA4 · Servo ×4</text>
</svg>
